[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alloydb-agentic-tiered-memory"
version = "0.1.0"
description = "Runnable source extracted from Google's AlloyDB AI tiered agent memory codelab"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "google-genai>=1,<3",
    "psycopg2-binary>=2.9,<3",
    "redis>=5,<8",
]

[project.optional-dependencies]
adk = ["google-adk>=1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.urls]
Codelab = "https://codelabs.developers.google.com/alloydb-agentic-tiered-memory"
Repository = "https://github.com/HenryHamster/alloydb-agentic-tiered-memory"

[tool.setuptools]
packages = ["shared"]
py-modules = [
    "db_clients", "valkey_buffer", "async_worker", "hybrid_retriever",
    "agent_orchestrator", "enterprise_engine", "adk_memory_provider",
    "adk_memory_tools", "adk_guardrails",
    "retain", "retain_models", "retain_store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
