name: Local checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra adk --extra dev
      - run: uv run --frozen --extra adk --extra dev ruff check .
      - run: uv run --frozen --extra adk --extra dev ruff format --check .
      - run: uv run --frozen --extra adk --extra dev pytest
